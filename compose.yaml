services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kasra-frontend:local
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /app/.next/cache:size=256m,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
