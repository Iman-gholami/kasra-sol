# The bucket the API and storage-init use: the storage service below, unless .env names another S3 provider.
x-bucket: &bucket
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:3900}
  S3_REGION: ${S3_REGION:-garage}
  S3_BUCKET: ${S3_BUCKET:-kasra-media}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kasra}
      POSTGRES_DB: ${POSTGRES_DB:-kasra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kasra} -d ${POSTGRES_DB:-kasra}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    security_opt:
      - no-new-privileges:true
  storage:
    # S3-compatible object storage for uploaded product photos (Garage, one node); see deploy/compose.production.yaml.
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - storage_data:/var/lib/garage
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
  storage-init:
    # Runs at every start and exits: prepares the bucket and the API's key, then copies photos that exist only in the
    # media volume into the bucket.
    build: *backend-build
    image: kasra-backend:local
    restart: "no"
    init: true
    depends_on:
      storage:
        condition: service_healthy
    command: ["node", "dist/admin/storage-setup.js"]
    environment:
      GARAGE_ADMIN_URL: ${GARAGE_ADMIN_URL-http://storage:3903}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN in .env}
      <<: *bucket
      MEDIA_DIR: /app/backend/uploads
    volumes:
      - media_data:/app/backend/uploads:ro
    security_opt:
      - no-new-privileges:true
  backend:
    build: *backend-build
    image: kasra-backend:local
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-kasra}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kasra}
      REDIS_URL: redis://redis:6379
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?Set ORDER_TOKEN_SECRET}
      # The API port is bound to loopback and the Compose network; only the Next.js server forwards visitors.
      TRUST_PROXY: "true"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Photos go to the object storage bucket, with a copy in MEDIA_DIR.
      <<: *bucket
      MEDIA_DIR: /app/backend/uploads
    volumes:
      - media_data:/app/backend/uploads
    cpus: 2.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_BACKEND_ENABLED: "true"
        NEXT_PUBLIC_SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: kasra-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_BACKEND_ENABLED: "true"
      BACKEND_INTERNAL_URL: http://backend:4000
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /app/.next/cache:size=256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  postgres_data:
  media_data:
  storage_data:
