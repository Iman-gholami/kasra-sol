# Shared by every Kasra server block; installed as /etc/nginx/snippets/kasra-proxy.conf by provision.sh.
client_max_body_size 3m;
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

location / {
  proxy_pass http://kasra_frontend;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Next.js takes the LAST X-Forwarded-For entry, the address Nginx appends here.
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_connect_timeout 10s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
  # No Nginx response cache: Next.js sends immutable headers for /_next/static itself.
}

# Shown for the few seconds the containers restart during a release.
error_page 502 504 =503 /__kasra_maintenance.html;
location = /__kasra_maintenance.html {
  root /var/www/kasra;
  internal;
  add_header Retry-After "30" always;
  add_header Cache-Control "no-store" always;
}

access_log /var/log/nginx/kasra-access.log;
error_log /var/log/nginx/kasra-error.log warn;
