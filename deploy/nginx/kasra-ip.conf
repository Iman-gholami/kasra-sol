# Temporary site until the domain is ready: HTTPS on the server address with a self-signed certificate.
# Rendered by provision.sh to /etc/nginx/sites-available/kasra; the SERVER_IP placeholder is filled in.
upstream kasra_frontend {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name __SERVER_IP__ _;
  ssl_certificate /etc/nginx/kasra/selfsigned.crt;
  ssl_certificate_key /etc/nginx/kasra/selfsigned.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:kasra_tls:10m;
  include snippets/kasra-proxy.conf;
}
