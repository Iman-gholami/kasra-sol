# Deploy as /etc/nginx/sites-available/kasra; then enable the symlink.
# Replace your-domain.example and configure HTTPS with certbot --nginx.
upstream kasra_frontend {
  server 127.0.0.1:3000;
  keepalive 32;
}
server {
  listen 80;
  listen [::]:80;
  server_name your-domain.example www.your-domain.example;
  client_max_body_size 2m;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  location /_next/static/ {
    proxy_pass http://kasra_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://kasra_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # No Nginx response cache for personalized/dynamic routes.
  }

  access_log /var/log/nginx/kasra-access.log;
  error_log /var/log/nginx/kasra-error.log warn;
}
