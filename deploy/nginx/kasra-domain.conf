# Site for the real domain with a Let's Encrypt certificate. Rendered by enable-domain.sh to
# /etc/nginx/sites-available/kasra; the DOMAIN, CERT_NAME and WWW_BLOCK placeholders are filled in.
upstream kasra_frontend {
  server 127.0.0.1:3000;
  keepalive 32;
}

# Plain HTTP: certificate renewals, everything else to the canonical HTTPS address.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://__DOMAIN__$request_uri; }
}

# The bare server address and unknown host names (self-signed certificate) go to the domain.
server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name _;
  server_tokens off;
  ssl_certificate /etc/nginx/kasra/selfsigned.crt;
  ssl_certificate_key /etc/nginx/kasra/selfsigned.key;
  return 301 https://__DOMAIN__$request_uri;
}
__WWW_BLOCK__
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name __DOMAIN__;
  ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:kasra_tls:10m;
  # Six months, without includeSubDomains/preload, so other subdomains are not forced onto HTTPS.
  add_header Strict-Transport-Security "max-age=15552000" always;
  include snippets/kasra-proxy.conf;
}
