# Production stack, installed on the server as /opt/kasra/compose.yaml by deploy/server/deploy.sh.
# Nothing is built or pulled on the server: .github/workflows/release.yml builds and smoke-tests the
# kasra-frontend/kasra-backend images, ships them with `docker save`, and sets KASRA_RELEASE in
# /opt/kasra/.env to the deployed commit. Keep services in step with ../compose.yaml (local development).
name: kasra
# The bucket the API and storage-init use: the storage service below, unless .env names another S3 provider.
x-bucket: &bucket
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:3900}
  S3_REGION: ${S3_REGION:-garage}
  S3_BUCKET: ${S3_BUCKET:-kasra-media}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
services:
  postgres:
    # Pinned so the server only changes database versions through a reviewed release.
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kasra}
      POSTGRES_DB: ${POSTGRES_DB:-kasra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kasra} -d ${POSTGRES_DB:-kasra}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    # A password although Redis is only on the private network: local users (the deployment runner)
    # can reach container addresses.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no",
      "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    security_opt:
      - no-new-privileges:true
    logging: *logging
  storage:
    # S3-compatible object storage for uploaded product photos: Garage, one node, on this server for now. Moving the
    # bucket to an external provider only changes the S3_* settings (docs/DEPLOYMENT.md, "Object storage"). Pinned; the
    # image travels with the PostgreSQL/Redis images. No published ports: only the API and storage-init reach it.
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - storage_data:/var/lib/garage
    read_only: true
    cap_drop: [ALL]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *logging
  storage-init:
    # Runs at every start and exits: prepares the bucket and the API's key, then copies photos that exist only in the
    # media volume into the bucket, compressed (all of them the first time; after a restore, the restored ones).
    image: kasra-backend:${KASRA_RELEASE:?KASRA_RELEASE is set by deploy.sh}
    restart: "no"
    init: true
    depends_on:
      storage:
        condition: service_healthy
    command: ["node", "dist/admin/storage-setup.js"]
    environment:
      NODE_ENV: production
      # Empty when the bucket is at an external provider: then only the copy runs.
      GARAGE_ADMIN_URL: ${GARAGE_ADMIN_URL-http://storage:3903}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN}
      <<: *bucket
      MEDIA_DIR: /app/backend/uploads
    volumes:
      - media_data:/app/backend/uploads:ro
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *logging
  backend:
    image: kasra-backend:${KASRA_RELEASE:?KASRA_RELEASE is set by deploy.sh}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
      DATABASE_URL: postgres://${POSTGRES_USER:-kasra}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kasra}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?Set ORDER_TOKEN_SECRET}
      # The API port is bound to loopback and the Compose network; only the Next.js server forwards visitors.
      TRUST_PROXY: "true"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Photos go to the object storage bucket, with a copy in MEDIA_DIR for the nightly backup and rollbacks.
      <<: *bucket
      MEDIA_DIR: /app/backend/uploads
    volumes:
      - media_data:/app/backend/uploads
    cpus: 2.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *logging
  frontend:
    image: kasra-frontend:${KASRA_RELEASE:?KASRA_RELEASE is set by deploy.sh}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_BACKEND_ENABLED: "true"
      BACKEND_INTERNAL_URL: http://backend:4000
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /app/.next/cache:size=256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 35s
    logging: *logging
volumes:
  postgres_data:
  media_data:
  storage_data:
