name: Production SSH
description: >-
  Configures `ssh kasra-prod` (as root: the scripts manage Docker, Nginx and systemd) from the production environment's secrets, with the server's host key pinned,
  and checks that the connection works.
inputs:
  private-key: { description: SSH_PRIVATE_KEY secret, required: true }
  known-hosts: { description: SSH_KNOWN_HOSTS secret (ssh-keyscan output for the server), required: true }
  host: { description: SSH_HOST secret (server IP address), required: true }
  port: { description: SSH_PORT secret, required: false, default: '' }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        KEY: ${{ inputs.private-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        for name in KEY KNOWN_HOSTS HOST; do
          if [ -z "${!name}" ]; then
            echo "::error::The production environment is missing a secret (SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS or SSH_HOST). See docs/DEPLOYMENT.md."
            exit 1
          fi
        done
        [[ ${PORT:-22} =~ ^[0-9]+$ ]] || { echo "::error::SSH_PORT must be a number"; exit 1; }
        install -d -m 700 ~/.ssh
        printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/kasra_deploy
        printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/kasra_known_hosts
        chmod 600 ~/.ssh/kasra_deploy ~/.ssh/kasra_known_hosts
        cat > ~/.ssh/config <<CONFIG
        Host kasra-prod
          HostName $HOST
          Port ${PORT:-22}
          User root
          IdentityFile ~/.ssh/kasra_deploy
          IdentitiesOnly yes
          StrictHostKeyChecking yes
          UserKnownHostsFile ~/.ssh/kasra_known_hosts
          ConnectTimeout 20
          ServerAliveInterval 15
          ServerAliveCountMax 8
        CONFIG
        if ! ssh kasra-prod true; then
          echo "::error::SSH to the server failed. Check SSH_HOST/SSH_PORT, that the public key is in the server's authorized_keys, and that SSH_KNOWN_HOSTS matches the server (ssh-keyscan)."
          exit 1
        fi
        echo "Connected to the production server."
