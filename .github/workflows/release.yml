name: Release
# Every change merged into main: all test suites, then the production images are built, proven on a
# disposable runner and stored as the release's artifacts. Nothing reaches the server here: deploy.yml
# installs a release only with the owner's one-time approval code. Run it by hand (Actions > Release > Run
# workflow, branch main) to rebuild main, e.g. after changing PRODUCTION_SITE_URL for the domain.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storefront:
    name: Storefront checks
    uses: ./.github/workflows/ci.yml
  api:
    name: API checks
    uses: ./.github/workflows/backend-ci.yml
  admin:
    name: Admin checks
    uses: ./.github/workflows/admin-e2e.yml
  images:
    name: Images
    needs: [storefront, api, admin]
    uses: ./.github/workflows/images.yml
    with:
      site-url: ${{ vars.PRODUCTION_SITE_URL }}
      publish: true

  ready:
    name: Ready to deploy
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - name: How to deploy this release
        run: |
          {
            echo "### Release \`$GITHUB_SHA\` is built and tested"
            echo "Production changes only with the owner's one-time approval code: Actions > Deploy > Run workflow,"
            echo "release \`$GITHUB_SHA\`, approval code from the authenticator app (or send the code to Claude)."
          } >> "$GITHUB_STEP_SUMMARY"
