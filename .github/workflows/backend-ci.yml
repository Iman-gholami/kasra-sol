name: Fastify Backend CI
# Pull requests touching the API, and every push to main through release.yml.
on:
  workflow_call:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml", "compose.yaml", "deploy/garage.toml", "src/data/**", "src/lib/format.ts"]
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kasra
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: kasra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kasra -d kasra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kasra:ci_test_password@localhost:5432/kasra
      ORDER_TOKEN_SECRET: ci_test_only_secret_that_is_long_enough_to_verify
      NEXT_PUBLIC_SITE_URL: https://kasra.example
      SHOPINO_API_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_API_KEY: ci_test_only_admin_key_that_is_long_enough_to_verify
      # The integration tests impersonate distinct visitors through X-Forwarded-For, as the Next.js proxy does.
      TRUST_PROXY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install API dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Unit tests
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Migrate and seed
        working-directory: backend
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
          npm run db:seed
      # The object storage as in Compose (deploy/garage.toml), prepared by storage-init's script, for the API below.
      - name: Start the object storage (Garage)
        run: |
          docker run -d --name storage -p 127.0.0.1:3900:3900 -p 127.0.0.1:3903:3903 \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" -e GARAGE_ADMIN_TOKEN=ci_test_only_garage_admin_token_0123456789 \
            -v "$PWD/deploy/garage.toml:/etc/garage.toml:ro" dxflrs/garage:v2.4.1
      - name: Real PostgreSQL and object storage API tests
        working-directory: backend
        env:
          GARAGE_ADMIN_URL: http://127.0.0.1:3903
          GARAGE_ADMIN_TOKEN: ci_test_only_garage_admin_token_0123456789
          S3_ENDPOINT: http://127.0.0.1:3900
          S3_BUCKET: kasra-media
          S3_ACCESS_KEY_ID: GK0123456789abcdef01234567
          S3_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MEDIA_DIR: /tmp/kasra-ci-media
        run: |
          node dist/admin/storage-setup.js
          node dist/index.js >/tmp/kasra-backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4000/health/ready >/dev/null; then break; fi
            sleep 1
          done
          node tests/smoke.mjs
          node tests/admin-smoke.mjs
          node --test --test-concurrency=1 tests/integration/*.mjs
      - name: API log on failure
        if: failure()
        run: |
          tail -n 200 /tmp/kasra-backend.log
          docker logs --tail 50 storage || true
