name: Storefront CI
# Pull requests, and every push to main through release.yml (which deploys only after these pass).
on:
  pull_request:
  workflow_call:
concurrency:
  group: storefront-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # The storefront ↔ API contract tests in tests-unit/ import the API's validation code.
      - name: Install API dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      # iPhone Safari is WebKit; flows that broke only on iOS are checked there too.
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: iPhone (WebKit) tests
        run: npx playwright test -c playwright.webkit.config.ts
      - name: Capture synthetic browser metrics
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          PORT=3100 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/kasra-v4-metrics.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/api/health > /dev/null; then break; fi
            sleep 2
          done
          BASE_URL=http://127.0.0.1:3100 OUTPUT_FILE=artifacts/screenshots/lab-metrics-v4.json node scripts/measure-lab.cjs
      # robots.txt, every page's robots meta tag and the sitemap follow one build-time switch (src/lib/seo.ts). Prerendered
      # pages and pages rendered per request once disagreed, so both builds are checked against a running server.
      - name: Search engines are kept out of a normal build
        run: node scripts/check-indexing.mjs http://127.0.0.1:3100 closed
      - name: Search engines are let in by a launch build
        env:
          NEXT_PUBLIC_SITE_INDEXABLE: "true"
          NEXT_PUBLIC_SITE_URL: https://kasraboutique.ir
        run: |
          npm run build
          cp -R .next/static .next/standalone/.next/
          cp -R public .next/standalone/
          # Started without the build's variables: the switch must come from the build, not the server's environment.
          env -u NEXT_PUBLIC_SITE_INDEXABLE -u NEXT_PUBLIC_SITE_URL PORT=3101 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/kasra-launch.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3101/api/health > /dev/null; then break; fi
            sleep 2
          done
          node scripts/check-indexing.mjs http://127.0.0.1:3101 open https://kasraboutique.ir
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
