name: Deploy
# Installs a release that the Release workflow built and tested on main. Runs on the server's sandboxed
# runner (deploy/server/runner-supervisor.sh); kasra-gate changes nothing unless the owner's one-time
# approval code from the authenticator app is valid (accepted once, for at most ten minutes).
# Started from Actions > Deploy > Run workflow, or by Claude after the owner sends the code in the chat.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Commit on main to deploy (40 characters; the Release run must have passed)
        type: string
        required: true
      approval_code:
        description: The owner's current 6-digit code from the authenticator app
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy to production
    runs-on: [self-hosted, kasra-prod]
    timeout-minutes: 40
    env:
      RELEASE: ${{ inputs.release }}
      APPROVAL_CODE: ${{ inputs.approval_code }}
      SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
    steps:
      - name: Check the inputs
        run: |
          echo "::add-mask::$APPROVAL_CODE"
          [[ $RELEASE =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release must be a full 40-character commit"; exit 1; }
          [[ $APPROVAL_CODE =~ ^[0-9]{6}$ ]] || { echo "::error::the approval code has 6 digits"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
          fetch-depth: 0
      - name: Check that the release is on main
        run: |
          git merge-base --is-ancestor "$RELEASE" origin/main || {
            echo "::error::$RELEASE is not on main; only merged, tested releases are deployed."
            exit 1
          }
      - name: Find the Release run that tested it
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$RELEASE&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')
          [ -n "$run_id" ] || { echo "::error::No successful Release run for $RELEASE (wait for it, or run Release on main)."; exit 1; }
          echo "Release run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.release }}
          path: bundle
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Find the database and cache images the server does not have yet
        id: infra
        run: |
          missing=$(APPROVAL_CODE='' python3 deploy/server/gate-client.py infra-missing "$GITHUB_WORKSPACE" | tr '\n' ' ')
          echo "Missing on the server: ${missing:-none}"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.infra.outputs.missing != ''
        with:
          name: infra-${{ inputs.release }}
          path: infra
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Deploy (backup, switch, verify, automatic rollback on failure)
        run: python3 deploy/server/gate-client.py deploy "$RELEASE" "$GITHUB_WORKSPACE"
      - name: Production status (personal data removed)
        if: always() && steps.run.outcome == 'success'
        run: APPROVAL_CODE='' python3 deploy/server/gate-client.py status 15m || true
      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deployment: ${{ job.status }}"
            echo "Commit \`$RELEASE\` — $SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
