name: Production operations
# Server tasks outside a normal release. Every run uses the protected "production" environment, so it
# waits for the owner's approval (Actions > this run > Review deployments) before touching the server.
# It runs on the server's own runner and acts only through kasra-gate with DEPLOY_TOKEN (see release.yml).
# Logs are public: the scripts print no secrets and strip personal data from application logs.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options: [status, inspect, provision, backup, rollback, restore, create-owner, enable-domain]
        default: status
      target:
        description: "rollback: commit to return to (empty = previous) | restore: db-….dump file | create-owner: login name | enable-domain: domain"
        type: string
        default: ""
      extra:
        description: "restore: optional media-….tar.gz file | enable-domain: e-mail for certificate notices (optional)"
        type: string
        default: ""
      confirm:
        description: "restore only: type RESTORE <db file name> to confirm replacing the database"
        type: string
        default: ""
      demo_data:
        description: "provision: load the demo catalog when the database is empty"
        type: choice
        options: ["false", "true"]
        default: "false"
      harden:
        description: "provision: enable the firewall (UFW: SSH, 80, 443 only) and fail2ban"
        type: boolean
        default: false
      www:
        description: "enable-domain: also certify www.<domain> (redirects to the domain)"
        type: boolean
        default: false
      skip_dns_check:
        description: "enable-domain: the domain points at a CDN, not straight at the server"
        type: boolean
        default: false
      log_window:
        description: "status: how far back to summarize warnings/errors (e.g. 30m, 6h)"
        type: string
        default: 2h
permissions:
  contents: read
  actions: read
concurrency:
  group: production-ops
  cancel-in-progress: false
jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: [self-hosted, kasra-prod]
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_SITE_URL }}
    env:
      TASK: ${{ inputs.task }}
      TARGET: ${{ inputs.target }}
      EXTRA: ${{ inputs.extra }}
      CONFIRM: ${{ inputs.confirm }}
      DEMO_DATA: ${{ inputs.demo_data }}
      HARDEN: ${{ inputs.harden }}
      WWW: ${{ inputs.www }}
      SKIP_DNS_CHECK: ${{ inputs.skip_dns_check }}
      LOG_WINDOW: ${{ inputs.log_window }}
      SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/production-gate
      - name: Validate the inputs
        run: |
          fail() { echo "::error::$*"; exit 1; }
          case "$TASK" in
            rollback) [ -z "$TARGET" ] || [[ $TARGET =~ ^[0-9a-f]{40}$ ]] || fail "target must be a full 40-character commit" ;;
            restore)
              [[ $TARGET =~ ^db-[0-9]{8}T[0-9]{6}Z-[a-z0-9-]+\.dump$ ]] || fail "target must be a db-….dump file name (see the status task)"
              [ -z "$EXTRA" ] || [[ $EXTRA =~ ^media-[0-9]{8}T[0-9]{6}Z-[a-z0-9-]+\.tar\.gz$ ]] || fail "extra must be a media-….tar.gz file name"
              [ "$CONFIRM" = "RESTORE $TARGET" ] || fail "type exactly: RESTORE $TARGET" ;;
            create-owner) [[ $TARGET =~ ^[a-z0-9][a-z0-9_.-]{2,63}$ ]] || fail "target must be the owner login (a-z 0-9 _ . -)" ;;
            enable-domain)
              [[ $TARGET =~ ^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$ ]] || fail "target must be the domain, e.g. shop.example.ir"
              [ -z "$EXTRA" ] || [[ $EXTRA =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]] || fail "extra must be an e-mail address" ;;
            provision) [[ $SITE_URL =~ ^https://[a-z0-9.-]+$ ]] || fail "set the repository variable PRODUCTION_SITE_URL first (e.g. https://<server IP>)" ;;
            status) [[ $LOG_WINDOW =~ ^[0-9]+[smh]$ ]] || fail "log_window looks like 30m or 6h" ;;
          esac
      - name: Run ${{ inputs.task }}
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          OWNER_PASSWORD: ${{ secrets.ADMIN_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::The production environment has no DEPLOY_TOKEN secret (printed by deploy/server/install-runner.sh)."
            exit 1
          fi
          gate() { printf '%s\n' "$DEPLOY_TOKEN" | sudo -n /usr/local/sbin/kasra-gate "$@"; }
          case "$TASK" in
            inspect) gate inspect "$GITHUB_WORKSPACE" ;;
            provision)
              gate inspect "$GITHUB_WORKSPACE"
              gate provision "$GITHUB_WORKSPACE" "$SITE_URL" "$DEMO_DATA" "$HARDEN" ;;
            status) gate status "$LOG_WINDOW" ;;
            backup) gate backup ;;
            rollback) gate rollback ${TARGET:+"$TARGET"} ;;
            restore) gate restore "$TARGET" ${EXTRA:+"$EXTRA"} ;;
            create-owner)
              if [ -z "$OWNER_PASSWORD" ]; then
                echo "::error::Add the environment secret ADMIN_OWNER_PASSWORD (12-256 characters) to production first."
                exit 1
              fi
              { printf '%s\n' "$DEPLOY_TOKEN"; printf '%s' "$OWNER_PASSWORD"; } | sudo -n /usr/local/sbin/kasra-gate create-owner "$TARGET"
              echo "Owner '$TARGET' created. You can now delete the ADMIN_OWNER_PASSWORD secret." ;;
            enable-domain) gate enable-domain "$GITHUB_WORKSPACE" "$TARGET" "$EXTRA" "$WWW" "$SKIP_DNS_CHECK" ;;
          esac
